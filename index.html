<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
  @theme {
    --font-outfit: "Outfit", sans-serif;
  }
</style>
  
  <title>Frontend Mentor | QR code component</title>

  
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body class = "bg-[hsl(212,45%,89%)] font-outfit">
  <main>
   <div class = "flex justify-center items-center min-h-screen">
    <div class = "w-[320px] text-center bg-white p-4 shadow-lg rounded-[20px]" >
      <img class="w-[288px] h-[288px] rounded-tr-[10px] rounded-bl-[10px]" src="./images/image-qr-code.png" alt="qr code">
      <h1 class = "font-bold text-[hsl(218,44%,22%)] text-[22px] leading-[1.2] mt-5 mb-[14.4px] px-4">Improve your front-end skills by building projects</h1>
      <p class = "text-[15px] text-[hsl(216,15%,48%)] mb-4 px-4 leading-[1.4]">Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</p>
    </div>
   </div>


  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Rovy</a>.
  </footer>
</body>
</html>
